[project]
name = "cash-lens-api"
version = "0.0.0"
description = "Cash Lens FastAPI backend"
readme = "README.md"
authors = [
    { name = "yravan", email = "yajvanravan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "cryptography>=48.0.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "plaid-python>=39.2.0",
    "pyjwt>=2.10.1",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.14.1",
    "python-dateutil>=2.9.0.post0",
    "sqlalchemy>=2.0.50",
    "uvicorn[standard]>=0.48.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.3",
]

[project.scripts]
cash-lens-api = "cash_lens_api.main:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
