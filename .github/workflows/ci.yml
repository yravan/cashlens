name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install API dependencies
        run: uv sync --group dev

      - name: Lint API
        run: uv run ruff check src tests

      - name: Test API
        run: uv run pytest

  web:
    name: web
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint web
        run: pnpm lint:web

      - name: Typecheck web
        run: pnpm typecheck:web

      - name: Test web
        run: pnpm test:web

      - name: Build web
        run: pnpm build:web

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - api
      - web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --group dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browser
        run: pnpm playwright:install

      - name: Run end-to-end smoke tests
        run: pnpm e2e:web

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results

  docs:
    name: docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Check version sync
        run: bash ./scripts/check-version-sync.sh

      - name: Build docs
        run: uv run --with-requirements docs/requirements.txt mkdocs build --strict
