name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Backend tests run against both SQLite (fast, default) and a Postgres 16
  # service container that matches Neon's major version (PLT-1.3). The bare
  # `api` gate job below aggregates these legs so the required check name stays
  # `api` for branch protection.
  api-tests:
    name: api-tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: sqlite
            database_url: ""
          - backend: postgres
            database_url: "postgresql+psycopg2://cashlens:cashlens@127.0.0.1:5432/cashlens"

    services:
      postgres:
        # Only the postgres leg connects; the sqlite leg ignores this service.
        image: ${{ matrix.backend == 'postgres' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: cashlens
          POSTGRES_PASSWORD: cashlens
          POSTGRES_DB: cashlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cashlens -d cashlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install API dependencies
        run: uv sync --group dev

      - name: Lint API
        run: uv run ruff check src tests

      - name: Test API (${{ matrix.backend }})
        env:
          DATABASE_URL: ${{ matrix.database_url }}
        run: uv run pytest

  # Required-check gate: branch protection requires `api`. It passes only when
  # every api-tests matrix leg (sqlite + postgres) succeeds.
  api:
    name: api
    runs-on: ubuntu-latest
    needs:
      - api-tests
    # `if: always()` forces the gate to run even when a matrix leg fails;
    # without it the gate is skipped, and branch protection treats a skipped
    # required check as satisfied. `needs.api-tests.result` is `success` only
    # when every matrix leg (sqlite + postgres) succeeds.
    if: always()
    steps:
      - name: Confirm API test matrix passed
        run: |
          if [ "${{ needs.api-tests.result }}" != "success" ]; then
            echo "api-tests matrix did not succeed: ${{ needs.api-tests.result }}"
            exit 1
          fi
          echo "All api-tests legs passed."

  web:
    name: web
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint web
        run: pnpm lint:web

      - name: Typecheck web
        run: pnpm typecheck:web

      - name: Test web
        run: pnpm test:web

      - name: Build web
        run: pnpm build:web

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - api
      - web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --group dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browser
        run: pnpm playwright:install

      - name: Run end-to-end smoke tests
        run: pnpm e2e:web

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results

  docs:
    name: docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Check version sync
        run: bash ./scripts/check-version-sync.sh

      - name: Build docs
        run: uv run --with-requirements docs/requirements.txt mkdocs build --strict
