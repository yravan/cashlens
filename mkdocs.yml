site_name: Cash Lens
site_description: Architecture, workflow, operations, and release documentation for the Cash Lens repo.
repo_url: https://github.com/yravan/cashlens
repo_name: yravan/cashlens
edit_uri: edit/main/docs/
site_url: !ENV [READTHEDOCS_CANONICAL_URL, ""]
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Deployment: deployment.md
  - Contributing: contributing.md
  - Testing strategy: engineering/testing-strategy.md
  - Pull request workflow: engineering/pull-request-workflow.md
  - Versioning and releases: versioning.md
  - Changelog: changelog.md
